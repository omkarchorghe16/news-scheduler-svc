$kind: http-request
url: "{{baseUrl}}{{apiPath}}/run"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Digest execution message received", function () {
        pm.expect(pm.response.text()).to.include("Daily digest executed successfully");
      });
    language: text/javascript
order: 2000
