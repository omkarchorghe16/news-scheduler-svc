$kind: http-request
url: "{{url}}{{apiPath}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response body is running message", function () {
        pm.expect(pm.response.text()).to.include("Stock News Scheduler Service is running");
      });
    language: text/javascript
order: 1000
