$kind: http-request
url: "{{baseUrl}}/api/stocks/{{stockId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ticker": "{{updatedStockTicker}}",
      "sectorId": {{sectorId}}
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("updatedStockTicker", "UP" + Date.now().toString().slice(-8));
    language: text/javascript
  - type: afterResponse
    code: pm.test("Stock is updated", function () { pm.response.to.have.status(200); pm.expect(pm.response.json().ticker).to.eql(pm.collectionVariables.get("updatedStockTicker")); });
    language: text/javascript
order: 9000
