$kind: http-request
url: "{{baseUrl}}/api/stocks/{{stockId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test("Stock is fetched by ID", function () { pm.response.to.have.status(200); pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("stockId"))); });
    language: text/javascript
order: 7000
