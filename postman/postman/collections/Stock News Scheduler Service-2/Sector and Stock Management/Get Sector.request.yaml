$kind: http-request
url: "{{url}}/api/sectors/{{sectorId}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test("Sector is fetched by ID", function () { pm.response.to.have.status(200); pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("sectorId"))); });
    language: text/javascript
order: 3000
