$kind: http-request
url: "{{baseUrl}}/api/stocks/fmp/profiles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "symbols": ["AAPL", "MSFT"]
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Returns an FMP profile for each requested symbol", function () {
        var profiles = pm.response.json();
        pm.expect(profiles).to.be.an("array").with.lengthOf(2);
        pm.expect(profiles.map(function (profile) { return profile.symbol; })).to.eql(["AAPL", "MSFT"]);
      });

      pm.test("Profile includes raw provider data", function () {
        pm.expect(pm.response.json()[0]).to.have.property("rawPayload");
      });
    language: text/javascript
order: 4000
