name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile application
        run: mvn --batch-mode -DskipTests package

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: build
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit and integration tests
        run: mvn --batch-mode test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  security:
    if: ${{ false }}
    name: Dependency security scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache OWASP Dependency-Check data
        id: dependency-check-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Scan dependencies with OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          update_option=()
          if [[ "${{ steps.dependency-check-cache.outputs.cache-hit }}" == "true" ]]; then
            update_option=(-DautoUpdate=false)
          fi

          mvn --batch-mode \
            org.owasp:dependency-check-maven:check \
            "${update_option[@]}" \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DfailBuildOnCVSS=7 \
            -Dformat=ALL

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package container
    runs-on: ubuntu-latest
    needs: [tests]
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Set image name
        id: image
        run: echo "image=${IMAGE_NAME,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.image }}

  deploy:
    name: Deploy to Docker Desktop Kubernetes
    runs-on: [self-hosted, macOS, ARM64]
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync secrets and deploy image
        env:
          APPLICATION_SECRETS_FILE: ${{ vars.APPLICATION_SECRETS_FILE }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLICATION_SECRETS_FILE}" || ! -r "${APPLICATION_SECRETS_FILE}" ]]; then
            echo "Set staging variable APPLICATION_SECRETS_FILE to a readable local secrets file on the Mac runner." >&2
            exit 1
          fi
          APP_SECRETS_FILE="${APPLICATION_SECRETS_FILE}" bash scripts/deploy-local-k8s.sh "${GITHUB_SHA}"

  smoke-tests:
    name: Verify deployed Kubernetes service
    runs-on: [self-hosted, macOS, ARM64]
    needs: [package, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check deployed health and metrics
        run: |
          set -euo pipefail
          if [[ "$(kubectl config current-context)" != "docker-desktop" ]]; then
            echo "Refusing smoke test: current kubectl context is not docker-desktop." >&2
            exit 1
          fi
          forward_log="${RUNNER_TEMP}/news-scheduler-port-forward-${GITHUB_RUN_ID}.log"
          kubectl port-forward --namespace dev service/news-scheduler-svc 18080:80 > "$forward_log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health/readiness > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$forward_log"
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/actuator/health \
            | grep -q '"status":"UP"'
          curl --fail --silent http://127.0.0.1:18080/actuator/metrics \
            | grep -q '"names"'
          curl --fail --silent http://127.0.0.1:18080/actuator/prometheus \
            | grep -q 'jvm_'
