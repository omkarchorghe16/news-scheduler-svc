name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ECR_REPOSITORY: news-scheduler-svc

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile application
        run: mvn --batch-mode -DskipTests package

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: build
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit and integration tests
        run: mvn --batch-mode test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  security:
    if: ${{ false }}
    name: Dependency security scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache OWASP Dependency-Check data
        id: dependency-check-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Scan dependencies with OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          update_option=()
          if [[ "${{ steps.dependency-check-cache.outputs.cache-hit }}" == "true" ]]; then
            update_option=(-DautoUpdate=false)
          fi

          mvn --batch-mode \
            org.owasp:dependency-check-maven:check \
            "${update_option[@]}" \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DfailBuildOnCVSS=7 \
            -Dformat=ALL

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package container
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-package

      - name: Log in to Amazon ECR
        id: login-ecr
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [[ -n "${ECR_REGISTRY}" ]]; then
            echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${ECR_REPOSITORY}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: ${{ steps.image.outputs.image }}

  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Read current ECS service task definition
        run: |
          set -euo pipefail
          cluster_status="$(aws ecs describe-clusters \
            --clusters news-scheduler \
            --query 'clusters[0].status' \
            --output text \
            --region "${AWS_REGION}")"
          if [[ "${cluster_status}" != "ACTIVE" ]]; then
            echo "::error::ECS cluster news-scheduler was not found or is not ACTIVE in ${AWS_REGION}."
            echo "Deploy infra/aws/cloudformation.yml successfully in the same AWS account and region before running this workflow. Check AWS_REGION and AWS_ROLE_ARN."
            exit 1
          fi

          task_definition_arn="$(aws ecs describe-services \
            --cluster news-scheduler \
            --services news-scheduler-svc \
            --query 'services[0].taskDefinition' \
            --output text \
            --region "${AWS_REGION}")"
          if [[ "${task_definition_arn}" == "None" || -z "${task_definition_arn}" ]]; then
            echo "::error::ECS service news-scheduler-svc was not found in cluster news-scheduler in ${AWS_REGION}."
            echo "Deploy infra/aws/cloudformation.yml first; it creates the ECS cluster, service, and bootstrap task definition."
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "${task_definition_arn}" \
            --query taskDefinition \
            --output json \
            --region "${AWS_REGION}" > "${RUNNER_TEMP}/task-definition.json"

      - name: Render task definition with this commit image
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: app
          image: ${{ needs.package.outputs.image }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: news-scheduler-svc
          cluster: news-scheduler
          desired-count: 1
          wait-for-service-stability: true

  smoke-tests:
    name: Verify deployed HTTPS service
    runs-on: ubuntu-latest
    needs: [package, deploy]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - name: Check deployed health and metrics
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ "${PUBLIC_BASE_URL}" != https://* ]]; then
            echo "Set the repository variable PUBLIC_BASE_URL to the deployed HTTPS URL." >&2
            exit 1
          fi
          base_url="${PUBLIC_BASE_URL%/}"
          for attempt in {1..30}; do
            if curl --fail --silent "${base_url}/actuator/health/readiness" > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent "${base_url}/actuator/health" \
            | grep -q '"status":"UP"'
          curl --fail --silent "${base_url}/actuator/metrics" \
            | grep -q '"names"'
          curl --fail --silent "${base_url}/actuator/prometheus" \
            | grep -q 'jvm_'
