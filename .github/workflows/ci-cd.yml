name: Java CI, Docker Build, and Kubernetes Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile application
        run: mvn --batch-mode -DskipTests package

  tests:
    name: Tests and Docker image
    runs-on: ubuntu-latest
    needs: build
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit and integration tests
        run: mvn --batch-mode package

      - name: Build Docker image
        run: docker build --tag "news-scheduler-svc:${GITHUB_SHA}" .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create application secret
        env:
          APP_SECRETS_YAML: ${{ secrets.APP_SECRETS_YAML }}
        run: |
          test -n "$APP_SECRETS_YAML" || { echo 'APP_SECRETS_YAML secret is required'; exit 1; }
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          printf '%s' "$APP_SECRETS_YAML" > "$RUNNER_TEMP/application-secrets.yml"
          kubectl create secret generic news-scheduler-secrets \
            --namespace dev \
            --from-file=application-secrets.yml="$RUNNER_TEMP/application-secrets.yml" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/service.yaml -f k8s/ingress.yaml
          sed "s|news-scheduler-svc:REPLACE_WITH_LOCAL_TAG|${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status --namespace dev deployment/news-scheduler-svc --timeout=180s
