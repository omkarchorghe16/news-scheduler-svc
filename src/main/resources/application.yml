spring:
  profiles:
    default: local
  config:
    # Optional, untracked local overrides. Keep property names in sync with application-secrets.yml.
    import: optional:file:./application-secrets.yml
  application:
    name: stock-news-scheduler-svc
  datasource:
    # Local secrets-file properties or environment variables override these defaults.
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:omkarchorghe}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      # Create/update the PostgreSQL schema from the JPA entities.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  task:
    scheduling:
      enabled: true

fmp:
  # Keep the key in application-secrets.yml or set FMP_API_KEY in the environment.
  base-url: ${FMP_BASE_URL:https://financialmodelingprep.com/stable}
  api-key: ${FMP_API_KEY:}
  daily-request-limit: ${FMP_DAILY_REQUEST_LIMIT:250}
  us-exchanges-only: ${FMP_US_EXCHANGES_ONLY:true}
  profile-cache-hours: ${FMP_PROFILE_CACHE_HOURS:24}

app:
  notifications:
    # Secret-file property names map directly to app.notifications.* below.
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      portfolio-webhook-url: ${SLACK_PORTFOLIO_WEBHOOK_URL:}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
    whatsapp:
      enabled: ${WHATSAPP_ENABLED:false}
      twilio-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_WHATSAPP_FROM:}
      to-number: ${TWILIO_WHATSAPP_TO:}
  apis:
    # API keys can be supplied through environment variables or application-secrets.yml.
    # Never add actual credentials to this tracked file.
    finnhub-key: ${FINNHUB_API_KEY:}
    newsapi-key: ${NEWSAPI_KEY:}
    finnhub-base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
    yahoo-base-url: ${YAHOO_FINANCE_BASE_URL:https://query1.finance.yahoo.com}
    alpha-vantage-key: ${ALPHA_VANTAGE_API_KEY:}
    alpha-vantage-base-url: ${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co/query}
    timeout-seconds: ${APP_APIS_TIMEOUT_SECONDS:5}
    max-retries: ${APP_APIS_MAX_RETRIES:3}
  schedule:
    cron-expression: ${APP_SCHEDULE_CRON_EXPRESSION:0 0 9 * * MON-FRI}
    timezone: ${APP_SCHEDULE_TIMEZONE:America/Chicago}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.stocknews: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
