spring:
  application:
    name: stock-news-scheduler-svc
  datasource:
    url: jdbc:h2:file:./data/news-scheduler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  task:
    scheduling:
      enabled: true

app:
  notifications:
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      portfolio-webhook-url: ${SLACK_PORTFOLIO_WEBHOOK_URL:}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:8843128366:AAHA-JbmWddcB4TJK6O7Y6PkdRqttynwVY4}
      chat-id: ${TELEGRAM_CHAT_ID:873498926}
    whatsapp:
      enabled: false
      twilio-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_WHATSAPP_FROM:}
      to-number: ${TWILIO_WHATSAPP_TO:}
  apis:
    # Set FINNHUB_API_KEY and/or NEWSAPI_KEY in the process environment.
    # Keep secrets out of this file and out of source control.
    finnhub-key: ${FINNHUB_API_KEY:daq610pr01qpiloo1fd0daq610pr01qpiloo1fdg}
    newsapi-key: ${NEWSAPI_KEY:8b23de3e16ca4546b2c868c69c6c35d6}
    timeout-seconds: 5
    max-retries: 3
  watchlist:
    us-symbols:
      - AAPL
      - GOOGL
      - MSFT
      - TSLA
      - META
      - AMZN
      - NVDA
      - JPM
      - V
      - WMT
    nse-symbols:
      - RELIANCE.NS
      - INFY.NS
      - TCS.NS
      - WIPRO.NS
      - LT.NS
      - MARUTI.NS
      - BAJAJ-AUTO.NS
      - ICICIBANK.NS
      - SBIN.NS
      - BHARTIARTL.NS
    portfolio-symbols: []
  schedule:
    cron-expression: "0 0 9 * * MON-FRI"
    timezone: "America/Chicago"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.stocknews: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
