# Local development configuration example for root/application-local.yml overrides.
# Keep actual secrets out of this file when possible; export environment variables instead.
# The local profile is the default and uses the PostgreSQL datasource configured in application.yml.

spring:
  jpa:
    show-sql: true

app:
  notifications:
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      portfolio-webhook-url: ${SLACK_PORTFOLIO_WEBHOOK_URL:}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
    whatsapp:
      enabled: false
      twilio-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_WHATSAPP_FROM:}
      to-number: ${TWILIO_WHATSAPP_TO:}
  apis:
    finnhub-key: ${FINNHUB_API_KEY:}
    newsapi-key: ${NEWSAPI_KEY:}
    finnhub-base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
    yahoo-base-url: ${YAHOO_FINANCE_BASE_URL:https://query1.finance.yahoo.com}
    timeout-seconds: 10
    max-retries: 2
fmp:
  api-key: ${FMP_API_KEY:}
  base-url: ${FMP_BASE_URL:https://financialmodelingprep.com/stable}
  daily-request-limit: ${FMP_DAILY_REQUEST_LIMIT:250}
  us-exchanges-only: ${FMP_US_EXCHANGES_ONLY:true}
  profile-cache-hours: ${FMP_PROFILE_CACHE_HOURS:24}
  watchlist:
    us-symbols:
      - AAPL
      - GOOGL
      - MSFT
    nse-symbols:
      - RELIANCE.NS
      - INFY.NS
      - TCS.NS
    portfolio-symbols:
      - AAPL
      - INFY.NS
  schedule:
    cron-expression: "0 */5 * * * *"  # Every 5 minutes for local testing
    timezone: "America/Chicago"

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.stocknews: DEBUG
    org.springframework.web: DEBUG
